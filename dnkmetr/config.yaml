# mode: fake — без железа (для отладки), real — реальные приборы через VISA
mode: real

# controller: hardware_cc — если источник поддерживает аппаратный CC (см. PLAN.md, раздел 0)
#             software_pi — если только CV, регулируем сами
controller: software_pi

# Каждый прибор = JSON-профиль (instruments/*.json, описывает SCPI-команды и параметры
# соединения) + конкретный VISA-ресурс. Смена прибора/вендора — правка только этого блока,
# без изменений в коде (см. instruments/README.md).
#
# auto_detect: true — вместо ручных profile/resource ниже приборы ищутся сами по *IDN?
# (см. discover.py): источник питания определяется однозначно, а какой из найденных
# мультиметров встал в петлю ОС (feedback), а какой на выход датчика (measurement) —
# по факту поведения при пробном возбуждении (см. discover.assign_multimeter_roles()).
# Удобно, когда физические приборы часто переставляют местами (журнал 12.08.2026: за
# сессию VISA-ресурсы и даже физические экземпляры менялись несколько раз). Работает
# только если ровно один источник питания и ровно один/два мультиметра видны на шине —
# при другом количестве или если auto_detect не задан (по умолчанию), используются
# explicit profile/resource ниже как раньше.
instruments:
  auto_detect: true
  power_supply:
    profile: "instruments/gwinstek_psu_generic.json"
    resource: "ASRL5::INSTR"  # COM5, 12.08.2026 — VISA-ресурс сместился с ASRL4 на ASRL5
                              # (другой физический экземпляр GPP-4323, SN:GEZ823773,
                              # отличается от прежнего SN:GEZ823770 — Windows пересобрала
                              # нумерацию портов). Проверять актуальный ASRLn через
                              # pyvisa.ResourceManager().list_resources() при каждом
                              # переподключении, он не гарантированно стабилен.

  # feedback_multimeter — в контуре обратной связи: держит основной ток возбуждения
  # через датчик на уставке (SoftwarePIController читает именно его на каждом шаге).
  # 12.08.2026 (вечер): RIGOL вернули на эту роль вместо второго АКИП (TW00053316,
  # больше не подключён — VI_ERROR_RSRC_NFOUND, если оставить его resource здесь).
  # Живьём отвечает на *IDN? нормально, никакого "remote"-переключения не требует
  # (в отличие от GPP-4323) — RSRC_NFOUND был просто из-за несовпадения config.yaml
  # с реальной физической конфигурацией, а не из-за состояния самого RIGOL.
  # Предохранитель токового входа (см. instruments/rigol_dm3068.json notes) всё ещё
  # НЕ проверен омметром — риск воспроизведения прежней проблемы (показания ~1/40-1/50
  # от реального тока) остаётся, проверить check_feedback_path() в первую очередь.
  feedback_multimeter:
    profile: "instruments/rigol_dm3068.json"
    resource: "USB0::0x1AB1::0x0C94::DM3O274802599::INSTR"

  # measurement_multimeter — читает ВЫХОДНОЙ сигнал датчика один раз после стабилизации
  # тока в контуре ОС. Выход датчика ТОКОВЫЙ (не потенциальный) — значит АКИП должен
  # стоять в режиме амперметра (см. sensor_circuit.measurement_mode ниже), включён
  # последовательно в выходную токовую петлю датчика.
  # Намеренно отдельный прибор от feedback_multimeter (п.3 обсуждения): нельзя мерить
  # обоими одновременно одним и тем же DMM, а частый опрос measurement-прибора внутри
  # петли ОС не нужен и был бы лишней нагрузкой на VISA-канал. Теперь оба мультиметра —
  # одна и та же модель (B7-78/1), но два разных физических экземпляра — различаются
  # серийником в resource, не профилем.
  measurement_multimeter:
    profile: "instruments/akip_b778.json"
    resource: "USB0::0x164E::0x0DAD::TW00053362::INSTR"

# Коэффициенты ниже подобраны на модели нагрузки (см. tune_current_loop.py), а не на
# реальном датчике — перед работой с настоящим стендом перетюнить (PLAN.md, итерация 2).
current_loop:
  setpoint_a: 0.010        # 10 мА
  deadband_a: 0.0002       # 0.2 мА — базовая (быстрая) стабилизация, как и было.
                            # Точность добирается ОТДЕЛЬНОЙ необязательной стадией
                            # ниже (fine_deadband_a/fine_timeout_s), а не ужесточением
                            # этого порога — так при сбое (см. current_control.py,
                            # reseed_from_current()/coarse_seed()) всегда есть более
                            # грубый, но быстрый и надёжный уровень, к которому можно
                            # откатиться.
  fine_deadband_a: 0.00004  # 0.04 мА — точная стадия после базовой стабилизации.
                            # На живом ДНК-М при удержании 30с получили std=0.016 мА,
                            # p2p=0.069 мА (журнал испытаний 12.08.2026) — с запасом
                            # выше фактического шума измерения, но заметно туже базы.
                            # Если не успевает за fine_timeout_s — не ошибка, просто
                            # остаёмся на базовой точности (см. measure_one()).
  fine_timeout_s: 10.0      # бюджет времени на точную стадию, отдельно от timeout_s
  max_voltage_v: 60.0     # ВАЖНО: паспортный максимум GPP-4323 в tracking-series = 64В
                          # (см. instruments/gwinstek_psu_generic.json). 1000.0 было
                          # безопасно только для FakePowerSupply — на реальном приборе
                          # обязателен потолок ниже физического предела источника.
  slew_rate_v_per_s: 25.0
  kp: 100.0
  ki: 1500.0
  dt_s: 0.2
  timeout_s: 30.0          # 12.08.2026: было 15.0 — увеличенный settle_s в coarse_seed()
                            # (см. current_control.py) удлиняет фазу бинарного поиска
                            # примерно вдвое, 15с стало впритык на реальном датчике.
  current_limit_a: 0.02    # 20 мА — аппаратный потолок ТОКА ВОЗБУЖДЕНИЯ (не выхода
                            # датчика), с запасом выше уставки. Подобран по факту:
                            # бисекция на реальном датчике может кратковременно
                            # переразогнаться до ~13.6 мА, прежде чем ПИ довернёт
                            # назад к уставке (эпизод 12.08.2026) — 12 мА (старое
                            # неявное значение) было тесно и срывало сходимость.

# Нагрузочный шунт (burden-резистор) в ВЫХОДНОЙ токовой петле датчика. Выход датчика —
# источник ТОКА, не напряжения: ему нужна нагрузка в разумном диапазоне, чтобы его
# внутренний токовый источник мог развить нужный ток при своём ограниченном compliance-
# напряжении (слишком большая нагрузка — источник тока не может её "продавить" и
# насыщается/клипует; слишком маленькая — вне штатного режима работы выходного каскада).
# АКИП (measurement_multimeter) включён В ЭТУ ЖЕ петлю последовательно, в режиме
# амперметра — сам шунт в расчёт тока software'ом НЕ участвует (см. measurement_mode).
# Это ОТДЕЛЬНАЯ цепь от основной петли возбуждения (current_loop выше) — собственное
# сопротивление датчика там уже учтено самим ПИ-регулятором, отдельно моделировать не нужно.
sensor_circuit:
  shunt_ohms: 10.0        # 12.08.2026: физически заменён на прецизионный 10 Ом (было 1 кОм)
  shunt_min_ohms: 1.0     # нижняя граница с запасом (~0.1x номинала)
  shunt_max_ohms: 100.0   # верхняя граница с запасом (~10x номинала)
  measurement_mode: "direct_current"  # АКИП в режиме амперметра — выход датчика токовый

sensors:
  - name: "sensor-1"
    type: "DNK-25"
    k_coeff: 1.0
  - name: "sensor-2"
    type: "DNK-M"
    k_coeff: 1.0

output:
  csv_path: "results/measurements.csv"
