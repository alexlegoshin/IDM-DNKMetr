# mode: fake — без железа (для отладки), real — реальные приборы через VISA
mode: fake

# controller: hardware_cc — если источник поддерживает аппаратный CC (см. PLAN.md, раздел 0)
#             software_pi — если только CV, регулируем сами
controller: software_pi

# Каждый прибор = JSON-профиль (instruments/*.json, описывает SCPI-команды и параметры
# соединения) + конкретный VISA-ресурс. Смена прибора/вендора — правка только этого блока,
# без изменений в коде (см. instruments/README.md).
instruments:
  power_supply:
    profile: "instruments/gwinstek_psu_generic.json"
    resource: "ASRL4::INSTR"  # COM4, подтверждено 29.07.2026 после установки официального
                              # драйвера GW Instek (см. instruments/README.md)

  # feedback_multimeter — в контуре обратной связи: держит основной ток возбуждения
  # через датчик на уставке (SoftwarePIController читает именно его на каждом шаге).
  # ОТКРЫТАЯ ПРОБЛЕМА: этот конкретный RIGOL подозревается в частично перегоревшем
  # предохранителе токового входа (см. instruments/rigol_dm3068.json notes и
  # README.md корня репозитория). Смена на другой прибор — это только правка
  # profile+resource ниже, без изменений в коде: instruments/akip_2101.json
  # (не проверен вживую) или instruments/akip_b778.json на втором физическом
  # экземпляре, если он есть.
  feedback_multimeter:
    profile: "instruments/rigol_dm3068.json"
    resource: "USB0::0x1AB1::0x0C94::DM3O274802599::INSTR"

  # measurement_multimeter — читает ВЫХОДНОЙ сигнал датчика один раз после стабилизации
  # тока в контуре ОС. Выход датчика ТОКОВЫЙ (не потенциальный) — значит АКИП должен
  # стоять в режиме амперметра (см. sensor_circuit.measurement_mode ниже), включён
  # последовательно в выходную токовую петлю датчика.
  # Намеренно отдельный прибор от feedback_multimeter (п.3 обсуждения): нельзя мерить
  # обоими одновременно одним и тем же DMM, а частый опрос measurement-прибора внутри
  # петли ОС не нужен и был бы лишней нагрузкой на VISA-канал.
  measurement_multimeter:
    profile: "instruments/akip_b778.json"
    resource: "USB0::0x164E::0x0DAD::TW00053362::INSTR"

# Коэффициенты ниже подобраны на модели нагрузки (см. tune_current_loop.py), а не на
# реальном датчике — перед работой с настоящим стендом перетюнить (PLAN.md, итерация 2).
current_loop:
  setpoint_a: 0.010        # 10 мА
  deadband_a: 0.0002       # 0.2 мА
  max_voltage_v: 60.0     # ВАЖНО: паспортный максимум GPP-4323 в tracking-series = 64В
                          # (см. instruments/gwinstek_psu_generic.json). 1000.0 было
                          # безопасно только для FakePowerSupply — на реальном приборе
                          # обязателен потолок ниже физического предела источника.
  slew_rate_v_per_s: 25.0
  kp: 100.0
  ki: 1500.0
  dt_s: 0.2
  timeout_s: 15.0

# Нагрузочный шунт (burden-резистор) в ВЫХОДНОЙ токовой петле датчика. Выход датчика —
# источник ТОКА, не напряжения: ему нужна нагрузка в разумном диапазоне, чтобы его
# внутренний токовый источник мог развить нужный ток при своём ограниченном compliance-
# напряжении (слишком большая нагрузка — источник тока не может её "продавить" и
# насыщается/клипует; слишком маленькая — вне штатного режима работы выходного каскада).
# АКИП (measurement_multimeter) включён В ЭТУ ЖЕ петлю последовательно, в режиме
# амперметра — сам шунт в расчёт тока software'ом НЕ участвует (см. measurement_mode).
# Это ОТДЕЛЬНАЯ цепь от основной петли возбуждения (current_loop выше) — собственное
# сопротивление датчика там уже учтено самим ПИ-регулятором, отдельно моделировать не нужно.
sensor_circuit:
  shunt_ohms: 1000.0        # физически впаянный шунт на стенде (номинал ~1 кОм)
  shunt_min_ohms: 100.0     # нижняя граница с запасом (~0.1x номинала)
  shunt_max_ohms: 10000.0   # верхняя граница с запасом (~10x номинала)
  measurement_mode: "direct_current"  # АКИП в режиме амперметра — выход датчика токовый

sensors:
  - name: "sensor-1"
    type: "DNK-25"
    k_coeff: 1.0
  - name: "sensor-2"
    type: "DNK-M"
    k_coeff: 1.0

output:
  csv_path: "results/measurements.csv"
